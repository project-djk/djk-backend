# 로컬 개발용 MySQL. docs/schema.sql 이 최초 1회 자동 적용된다.
# 스키마를 바꿨다면 볼륨을 지우고 다시 올린다: docker compose down -v && docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: djk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 환경변수(.env)를 설정하세요}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - djk-mysql-data:/var/lib/mysql
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  djk-mysql-data:
