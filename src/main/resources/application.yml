spring:
  application:
    name: djk-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/djk?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      # 테이블명이 대문자(KEYWORD 등)이고 Linux MySQL 은 대소문자를 구분하므로, 매핑에 적은 이름을 그대로 쓴다.
      # 대신 엔티티의 테이블/컬럼명은 @Table / @Column 으로 모두 명시한다.
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    # hibernate.jdbc.time_zone 은 설정하지 않는다. DATETIME 은 KST 벽시계 값이고 LocalDateTime 으로 그대로 매핑한다.
    # 설정하면 JVM 시간대가 KST 가 아닐 때(CI, Docker) 값이 9시간 어긋난다. (ADR-0002)

server:
  port: 8080

# Swagger UI 와 /v3/api-docs 는 기본으로 끈다. local·dev 프로파일에서만 켠다. (ADR-0004)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
# application-local.yml 은 개인 설정용으로 .gitignore 되어 있으므로, 프로파일별 공통 설정은 여기에 둔다.
spring:
  config:
    activate:
      on-profile: local | dev

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
